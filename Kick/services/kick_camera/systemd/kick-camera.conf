# /
# Settings for kick-camera. One key=value per line, '#' starts a comment.
# The camera is closed until a client sends "enable" on the control socket, whatever is set here.

# v4l2 is the real camera: the MIPI CSI sensor or a USB webcam, whichever device= points at.
source = v4l2
# The device node is not known until the unit exists. /dev/video0 is a placeholder.
device = /dev/video0

# Small and slow on purpose: gestures do not need more, and the CPU is shared with the audio engine.
size = 320x240
fps = 15
format = auto

# Exposure and white balance start: lit_room (sensor decides, frame rate fixed) or dim_stage (fixed long exposure).
preset = lit_room

# Where other processes find the frames and send commands.
shm = /kick-camera
socket = /run/kick-camera.sock

# Frames are never written to disk unless this is set. Debug only; leave it commented out.
# debug_dump = /run/kick-camera-dump
# debug_dump_max = 100
