# Settings for kick-gesture. One key = value per line, '#' starts a comment.
# Gesture thresholds are not here: they are in /etc/kick-gesture/gesture.json (gesture_config below).

# Where the camera service publishes frames. kick-gesture reads them and never writes.
shm = /kick-camera

# Inferences per second at full rate. The guard halves it when the CPU or the board runs hot.
rate_hz = 12

# int8 is the shipped default. fp32 is bigger and slower, for comparison only.
model_set = int8
model_dir = /usr/share/kick-gesture/models

# One thread: the audio engine owns the other cores.
threads = 1

gesture_config = /etc/kick-gesture/gesture.json

# The Kick app listens on this loopback address and the service connects to it. Events are dropped, not queued, while
# the app is not there, and reconnect attempts back off from 1 s up to 30 s.
events_ipc = 127.0.0.1:50501

# Limits for the CPU and temperature guard. cpu_* are fractions of one core.
cpu_soft = 0.60
cpu_hard = 0.90
temp_soft_c = 75
temp_hard_c = 85

# Writes the landmark stream (hand geometry, no pixels) to a file for replay. Debug only; leave it commented out.
# record = /run/kick-gesture-landmarks.jsonl
